<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121b">
<title>예배당, 잠깐 머물러요</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#ece6d8;--dim:#a39c8c;--faint:#6d6758;--night:#14121b;--flame:#ffc76b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:"Noto Sans KR",sans-serif;font-weight:300;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  .serif{font-family:"Gowun Batang",serif}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

  .hud-top{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
  .brand{font-family:"Gowun Batang",serif;font-size:20px;letter-spacing:.25em;text-shadow:0 2px 12px #000}
  .brand small{display:block;font-family:"Noto Sans KR";font-size:11px;letter-spacing:.05em;color:var(--dim);margin-top:4px}
  .icons{display:flex;gap:8px;pointer-events:auto}
  .ibtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(236,230,216,.18);background:rgba(20,18,27,.6);color:var(--dim);
    display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .ibtn.off{opacity:.45}

  /* 조이스틱 */
  #joy{position:fixed;left:calc(26px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;
    border:1px solid rgba(236,230,216,.18);background:rgba(20,18,27,.35);z-index:3;display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(236,230,216,.85);
    box-shadow:0 4px 18px rgba(0,0,0,.4)}
  .touch #joy{display:block}

  #act{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:3;
    border:0;background:var(--ink);color:var(--night);font:inherit;font-weight:500;font-size:15px;padding:14px 26px;border-radius:999px;cursor:pointer;
    box-shadow:0 6px 30px rgba(255,199,107,.25);transition:.25s;white-space:nowrap}
  #act.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #act kbd{font-family:inherit;font-size:11px;border:1px solid rgba(20,18,27,.35);border-radius:5px;padding:1px 6px;margin-right:8px;opacity:.7}
  .touch #act{left:auto;right:calc(22px + env(safe-area-inset-right));transform:translate(0,20px)}
  .touch #act.show{transform:none}
  .touch #act kbd{display:none}

  .hint{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);color:var(--dim);font-size:12px;z-index:2;
    text-shadow:0 1px 8px #000;transition:opacity 1s;white-space:nowrap;pointer-events:none}
  .touch .hint{bottom:auto;top:calc(70px + env(safe-area-inset-top))}

  /* 패널 */
  .panel{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);width:min(440px,calc(100vw - 28px));z-index:5;
    background:rgba(24,22,32,.92);border:1px solid rgba(236,230,216,.12);border-radius:22px;padding:26px 24px 22px;text-align:center;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:.35s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .panel.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .panel .x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--faint);font-size:22px;cursor:pointer;line-height:1;padding:4px}
  .label{font-size:11px;letter-spacing:.35em;color:var(--faint);margin-bottom:12px}
  .panel h3{font-family:"Gowun Batang",serif;font-weight:400;font-size:20px;line-height:1.6}
  .panel p.sub{color:var(--dim);font-size:13px;line-height:1.8;margin-top:6px}
  .btn{margin-top:18px;border:1px solid rgba(236,230,216,.28);background:none;color:var(--ink);font:inherit;font-size:14px;padding:12px 26px;border-radius:999px;cursor:pointer}
  .btn.solid{background:var(--ink);color:var(--night);border-color:var(--ink);font-weight:500}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  input[type=text],textarea{width:100%;margin-top:16px;background:rgba(255,255,255,.05);border:1px solid rgba(236,230,216,.15);color:var(--ink);
    font-family:"Gowun Batang",serif;font-size:15px;line-height:1.7;padding:12px 15px;border-radius:12px;outline:none;resize:none;user-select:text;-webkit-user-select:text}
  input:focus,textarea:focus{border-color:rgba(255,199,107,.45)}
  ::placeholder{color:var(--faint)}
  .verse{font-family:"Gowun Batang",serif;font-size:18px;line-height:1.95;margin-top:4px;transition:opacity .4s}
  .ref{color:var(--flame);font-size:12px;letter-spacing:.1em;margin-top:12px}
  .chip{border:1px solid rgba(236,230,216,.2);background:none;color:var(--dim);font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;margin-top:14px}
  .chip.on{background:var(--ink);color:var(--night);border-color:var(--ink)}
  .time{font-family:"Gowun Batang",serif;font-size:40px;margin-top:6px}
  .breath{font-family:"Gowun Batang",serif;color:var(--dim);font-size:14px;min-height:1.6em;margin-top:6px;transition:opacity 1s}

  /* 입장 화면 */
  #intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
    background:radial-gradient(120% 80% at 50% 0%,#2c2838 0%,#1c1a24 55%,#131119 100%);transition:opacity 1s}
  #intro.hide{opacity:0;pointer-events:none}
  #intro h1{font-family:"Gowun Batang",serif;font-size:42px;letter-spacing:.3em;margin-right:-.3em}
  #intro .tag{color:var(--dim);font-size:14px;line-height:1.8;margin-top:12px}
  .avatars{display:flex;gap:14px;margin-top:34px}
  .av{width:84px;padding:12px 0 10px;border-radius:16px;border:1px solid rgba(236,230,216,.14);background:rgba(255,255,255,.03);cursor:pointer;color:var(--dim);font:inherit;font-size:12px}
  .av.on{border-color:var(--flame);color:var(--ink);background:rgba(255,199,107,.07)}
  .av i{display:block;width:30px;height:42px;margin:0 auto 8px;border-radius:15px 15px 6px 6px;position:relative}
  .av i::before{content:"";position:absolute;left:50%;top:-16px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#e8c9a8}
  .av i::after{content:"";position:absolute;left:50%;top:4px;width:6px;height:34px;margin-left:-3px;border-radius:3px;background:var(--s)}
  #intro .btn{margin-top:30px;padding:14px 40px;font-size:15px}
  .keys{margin-top:26px;color:var(--faint);font-size:12px;line-height:1.9}

  .online{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:"Noto Sans KR";font-size:12px;letter-spacing:0;color:var(--ink);
    background:rgba(20,18,27,.6);border:1px solid rgba(236,230,216,.12);padding:5px 11px;border-radius:999px;backdrop-filter:blur(8px)}
  .online i{width:7px;height:7px;border-radius:50%;background:#6d6758}
  .online.on i{background:#7fd18b;box-shadow:0 0 8px #7fd18b}
  .emotes{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .emotes .ibtn{font-size:18px}
  #intro input{max-width:260px;text-align:center;margin-top:26px}
  .privacy{margin-top:14px;color:var(--faint);font-size:11px;line-height:1.7}
  #toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:"Gowun Batang",serif;font-size:18px;color:var(--ink);
    text-shadow:0 0 20px rgba(255,199,107,.7),0 2px 10px #000;opacity:0;transition:opacity 1s;pointer-events:none;z-index:6;text-align:center;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud-top">
  <div class="brand">예배당<small id="where">본당</small><div class="online" id="online"><i></i><span id="onlineText">연결 중…</span></div></div>
  <div class="icons" style="flex-direction:column;align-items:flex-end">
   <div style="display:flex;gap:8px">
    <button class="ibtn" id="snd" title="배경 음악">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    </button>
   </div>
   <div class="emotes" id="emotes">
     <button class="ibtn" data-e="0" title="아멘 (1)">🙏</button>
     <button class="ibtn" data-e="1" title="인사 (2)">👋</button>
     <button class="ibtn" data-e="2" title="평안 (3)">🕊️</button>
   </div>
  </div>
</div>

<div class="hint" id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<button id="act"><kbd>E</kbd><span id="actText"></span></button>
<div id="toast"></div>

<!-- 패널들 -->
<div class="panel" id="p-candle">
  <button class="x" data-close>×</button>
  <div class="label">CANDLE</div>
  <h3>촛불 하나 밝히고<br>마음을 내려놓으세요</h3>
  <p class="sub" id="ccount"></p>
  <input type="text" id="cname" maxlength="24" placeholder="누구를 위한 촛불인가요? (선택)">
  <button class="btn solid" id="light">촛불 켜기</button>
</div>

<div class="panel" id="p-word">
  <button class="x" data-close>×</button>
  <div class="label">WORD</div>
  <p class="verse" id="verse"></p>
  <p class="ref" id="ref"></p>
  <button class="btn" id="nextV">다른 말씀</button>
</div>

<div class="panel" id="p-pray">
  <button class="x" data-close>×</button>
  <div class="label">PRAYER</div>
  <h3>기도를 올려 드리세요</h3>
  <p class="sub">적은 기도는 저장되지 않고 하늘로 올라가 사라집니다.</p>
  <textarea id="ptext" rows="4" maxlength="300" placeholder="하나님, 오늘은…"></textarea>
  <button class="btn solid" id="send">기도 올리기</button>
</div>

<div class="panel" id="p-sit">
  <div class="label">SILENCE</div>
  <h3>잠잠히 머무는 시간</h3>
  <div class="time" id="time">3:00</div>
  <p class="breath" id="breath">아무 말도 하지 않아도 괜찮습니다</p>
  <div class="row" id="chips">
    <button class="chip" data-m="1">1분</button><button class="chip on" data-m="3">3분</button>
    <button class="chip" data-m="5">5분</button><button class="chip" data-m="10">10분</button>
  </div>
  <div class="row">
    <button class="btn solid" id="startSil">시작</button>
    <button class="btn" id="standUp">일어나기</button>
  </div>
</div>

<!-- 입장 -->
<div id="intro">
  <h1>예배당</h1>
  <p class="tag serif">말없이 같이 앉아 있는<br>온라인 예배당</p>
  <div class="avatars" id="avs">
    <button class="av on" data-k="0"><i style="background:#f1ece0;--s:#b23a48"></i>성가복</button>
    <button class="av" data-k="1"><i style="background:#2f3a5a;--s:#c9a24a"></i>주일 정장</button>
    <button class="av" data-k="2"><i style="background:#8a7458;--s:#5a4632"></i>순례자</button>
  </div>
  <input type="text" id="myname" maxlength="10" placeholder="이름 (선택)">
  <button class="btn solid" id="enter">입장하기</button>
  <p class="privacy">다른 방문자에게는 이름과 위치만 보여요.<br>기도와 촛불에 적은 글은 전송되지 않습니다.</p>
  <p class="keys" id="keys"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
if(isTouch) document.body.classList.add('touch');
document.getElementById('keys').innerHTML = isTouch
  ? '왼쪽 조이스틱으로 걷기 · 화면을 끌어 둘러보기'
  : 'WASD · 방향키로 걷기 · Shift 천천히<br>마우스로 끌어 둘러보기 · E 상호작용';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 기본 ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14121b);
scene.fog=new THREE.Fog(0x14121b,18,42);
const camera=new THREE.PerspectiveCamera(55,1,.1,100);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0x8a86a8,0x2a2018,.55));
const warm=new THREE.PointLight(0xffb870,1.1,26,1.6);warm.position.set(0,6,-11);scene.add(warm);
const fill=new THREE.PointLight(0x8fa0ff,.35,30,1.5);fill.position.set(0,7,8);scene.add(fill);

/* ---------- 텍스처 ---------- */
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}t.anisotropy=4;return t}
const floorTex=canvasTex(256,256,(g,w,h)=>{
  for(let y=0;y<2;y++)for(let x=0;x<2;x++){const v=58+((x+y)%2)*10+Math.random()*6;g.fillStyle=`rgb(${v+6},${v},${v-8})`;g.fillRect(x*128,y*128,128,128)}
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=3;for(let i=0;i<=2;i++){g.beginPath();g.moveTo(i*128,0);g.lineTo(i*128,256);g.stroke();g.beginPath();g.moveTo(0,i*128);g.lineTo(256,i*128);g.stroke()}
  for(let i=0;i<600;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.04})`;g.fillRect(Math.random()*256,Math.random()*256,2,2)}
},[9,15]);
const carpetTex=canvasTex(64,256,(g,w,h)=>{g.fillStyle='#6e1f2a';g.fillRect(0,0,w,h);g.fillStyle='#c9a24a';g.fillRect(4,0,3,h);g.fillRect(w-7,0,3,h);
  for(let i=0;i<300;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[1,6]);
const wallTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#4a4450';g.fillRect(0,0,w,h);
  for(let y=0;y<8;y++)for(let x=0;x<4;x++){const o=(y%2)*32;const v=68+Math.random()*14;g.fillStyle=`rgb(${v},${v-4},${v+4})`;g.fillRect(x*64+o-62+1,y*32+1,62,30);g.fillRect(x*64+o+2,y*32+1,62,30)}},[6,2]);
const woodTex=canvasTex(128,32,(g,w,h)=>{g.fillStyle='#4b2e1e';g.fillRect(0,0,w,h);for(let i=0;i<14;i++){g.strokeStyle=`rgba(${20+Math.random()*30},10,0,.5)`;g.beginPath();const y=Math.random()*h;g.moveTo(0,y);g.bezierCurveTo(40,y+3,80,y-3,128,y+1);g.stroke()}});
function glassTex(seed){return canvasTex(128,256,(g,w,h)=>{
  const cols=['#2e5aa8','#b23a48','#d9a63a','#3f8a62','#6a3fa0','#2f86a8','#e0763a'];let s=seed;const r=()=>(s=(s*9301+49297)%233280)/233280;
  g.fillStyle='#111';g.fillRect(0,0,w,h);
  g.save();g.beginPath();g.moveTo(0,h);g.lineTo(0,64);g.quadraticCurveTo(0,0,64,0);g.quadraticCurveTo(128,0,128,64);g.lineTo(128,h);g.closePath();g.clip();
  for(let y=0;y<h;y+=32)for(let x=0;x<w;x+=32){g.fillStyle=cols[Math.floor(r()*cols.length)];g.beginPath();
    if(r()<.5){g.moveTo(x,y);g.lineTo(x+32,y);g.lineTo(x,y+32)}else{g.moveTo(x+32,y);g.lineTo(x+32,y+32);g.lineTo(x,y)}g.fill();
    g.fillStyle=cols[Math.floor(r()*cols.length)];g.beginPath();g.moveTo(x+32,y+32);g.lineTo(x,y+32);g.lineTo(r()<.5?x+32:x,y);g.fill()}
  g.fillStyle='rgba(255,240,200,.85)';g.fillRect(58,60,12,150);g.fillRect(34,100,60,12);
  g.restore();g.strokeStyle='#111';g.lineWidth=3;for(let y=0;y<h;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}for(let x=0;x<w;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}
})}
const roseTex=canvasTex(256,256,(g,w,h)=>{const c=['#2e5aa8','#b23a48','#d9a63a','#3f8a62','#6a3fa0'];g.translate(128,128);
  for(let ring=3;ring>=0;ring--){const n=8+ring*4,R=30+ring*30;for(let i=0;i<n;i++){g.fillStyle=c[(i+ring)%c.length];g.beginPath();g.moveTo(0,0);g.arc(0,0,R,i/n*Math.PI*2,(i+1)/n*Math.PI*2);g.fill()}}
  g.strokeStyle='#111';g.lineWidth=3;for(let r=30;r<=120;r+=30){g.beginPath();g.arc(0,0,r,0,7);g.stroke()}
  for(let i=0;i<20;i++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(i/20*7)*124,Math.sin(i/20*7)*124);g.stroke()}
  g.fillStyle='#ffe9b0';g.beginPath();g.arc(0,0,16,0,7);g.fill();
  g.globalCompositeOperation='destination-in';g.beginPath();g.arc(0,0,124,0,7);g.fill()});
const glowTex=canvasTex(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,210,130,.9)');r.addColorStop(1,'rgba(255,150,50,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
const shadowTex=canvasTex(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(0,0,0,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});

/* ---------- 예배당 ---------- */
const W=9, ZF=-16, ZB=14, PLAT=-11, PH=.4;
const M=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.85,metalness:0},o));
const add=(geo,mat,x,y,z,p=scene)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m};

add(new THREE.PlaneGeometry(W*2,ZB-ZF),M({map:floorTex}),0,0,(ZF+ZB)/2).rotation.x=-Math.PI/2;
add(new THREE.PlaneGeometry(2.4,ZB-PLAT),M({map:carpetTex,roughness:1}),0,.01,(PLAT+ZB)/2).rotation.x=-Math.PI/2;
// 강단
const platMat=M({map:woodTex,color:0x9a7a5c});
add(new THREE.BoxGeometry(W*2,PH,PLAT-ZF),platMat,0,PH/2,(ZF+PLAT)/2);
add(new THREE.BoxGeometry(4,PH/2,.4),platMat,0,PH/4,PLAT+.2);
// 벽
const wallMat=M({map:wallTex});const wallH=9;
add(new THREE.BoxGeometry(.4,wallH,ZB-ZF),wallMat,-W-.2,wallH/2,(ZF+ZB)/2);
add(new THREE.BoxGeometry(.4,wallH,ZB-ZF),wallMat,W+.2,wallH/2,(ZF+ZB)/2);
add(new THREE.BoxGeometry(W*2+.8,wallH,.4),wallMat,0,wallH/2,ZF-.2);
// 기둥

let ac,pad=null,musicOn=true;
function A(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function bellSound(soft){try{const a=A(),t=a.currentTime,b=soft?392:262;
  [[1,.5],[2.01,.22],[2.76,.14],[4.07,.08],[5.4,.04]].forEach(([r,g])=>{const o=a.createOscillator(),v=a.createGain();o.frequency.value=b*r;
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g*(soft?.35:.7),t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+(soft?3:7)/r**.3);o.connect(v).connect(a.destination);o.start(t);o.stop(t+8)})}catch(e){}}
function startPad(){try{const a=A();if(pad)return;const out=a.createGain();out.gain.value=0;out.connect(a.destination);
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(out);
  const chords=[[130.8,196,261.6,329.6],[110,164.8,220,261.6],[87.3,130.8,174.6,220],[98,146.8,196,246.9]];
  const oscs=chords[0].map((f,i)=>{const o=a.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=f;const g=a.createGain();g.gain.value=i?.18:.25;o.connect(g).connect(lp);o.start();return o});
  let ci=0;const iv=setInterval(()=>{ci=(ci+1)%chords.length;oscs.forEach((o,i)=>o.frequency.setTargetAtTime(chords[ci][i],a.currentTime,1.5))},9000);
  out.gain.setTargetAtTime(.05,a.currentTime,2);pad={out,oscs,iv}}catch(e){}}
function stopPad(){if(!pad)return;const p=pad;pad=null;p.out.gain.setTargetAtTime(0,ac.currentTime,.6);setTimeout(()=>{p.oscs.forEach(o=>o.stop());clearInterval(p.iv)},2500)}
document.getElementById('snd').onclick=()=>{musicOn=!musicOn;document.getElementById('snd').classList.toggle('off',!musicOn);musicOn?startPad():stopPad()};

 ['평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라','요한복음 14:27'],['내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬','시편 121:1'],
 ['상한 갈대를 꺾지 아니하며 꺼져가는 등불을 끄지 아니하고','이사야 42:3'],['항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라','데살로니가전서 5:16-18'],
 ['두려워 말라 내가 너와 함께 함이니라','이사야 41:10'],['주의 말씀은 내 발에 등이요 내 길에 빛이니이다','시편 119:105'],
 ['너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라','베드로전서 5:7'],['저녁에는 울음이 기숙할지라도 아침에는 기쁨이 오리로다','시편 30:5'],
 ['내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라','고린도후서 12:9']];
let vi=Math.floor(Date.now()/864e5)%verses.length;
function showV(){$('verse').style.opacity=0;setTimeout(()=>{$('verse').textContent=verses[vi][0];$('ref').textContent=verses[vi][1];$('verse').style.opacity=1},250)}
$('nextV').onclick=()=>{vi=(vi+1+Math.floor(Math.random()*(verses.length-1)))%verses.length;showV()};

// 기도
const risers=[];
$('send').onclick=()=>{const t=$('ptext').value.trim();if(!t){$('ptext').focus();return}
  const txt=t.length>18?t.slice(0,18)+'…':t;const s=labelSprite(txt);s.material.depthTest=true;s.position.set(PR.x,1.4,PR.z);s.scale.set(2,.56,1);
  const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));g.position.copy(s.position);g.scale.set(.8,.8,1);scene.add(g);
  risers.push({s,g,t:0});sendEvent({type:'pray'});$('ptext').value='';closePanels();bellSound(true);
  setTimeout(()=>toast(['그 기도, 들으셨습니다.','평안히 가세요.','짐을 내려놓으셨습니다.'][Math.floor(Math.random()*3)]+'<br>아멘.'),1800)};

// 종
let bellSwing=0;
// 침묵
let mins=3,timer=null,remain=0;const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{if(timer)return;document.querySelectorAll('#chips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');mins=+c.dataset.m;$('time').textContent=fmt(mins*60)});
const breaths=['숨을 들이쉬고…','천천히 내쉬세요','“주는 나의 목자시니”','숨을 들이쉬고…','천천히 내쉬세요','“내가 부족함이 없으리로다”'];let bi=0,bt;
function stopSil(done){clearInterval(timer);clearInterval(bt);timer=null;$('startSil').textContent='시작';$('time').textContent=fmt(mins*60);
  $('breath').textContent=done?'평안이 함께하기를':'아무 말도 하지 않아도 괜찮습니다';if(done)bellSound()}
$('startSil').onclick=()=>{if(timer){stopSil(false);return}remain=mins*60;bellSound(true);$('startSil').textContent='멈추기';bi=0;$('breath').textContent=breaths[0];
  bt=setInterval(()=>{$('breath').style.opacity=0;setTimeout(()=>{bi=(bi+1)%breaths.length;$('breath').textContent=breaths[bi];$('breath').style.opacity=1},1000)},6000);
  timer=setInterval(()=>{remain--;$('time').textContent=fmt(remain);if(remain<=0)stopSil(true)},1000)};
$('standUp').onclick=standUp;
function standUp(){if(!sitting)return;stopSil(false);player.position.z=sitting.z-.8;sitting=null;closePanels()}

/* ---------- 상호작용 ---------- */
let current=null;
function nearestPew(){const p=player.position;for(const w of pews){if(p.x>w.x0-.3&&p.x<w.x1+.3&&Math.abs(p.z-(w.z-.75))<.55)return w;
  if((Math.abs(p.x-w.x0)<.7||Math.abs(p.x-w.x1)<.7)&&Math.abs(p.z-w.z)<.6)return w}return null}
function doAct(){if(frozen||openPanel&&openPanel!=='p-sit')return;if(!current)return;const c=current;
  if(c.id==='candle'){renderCount();show('p-candle');setTimeout(()=>!isTouch&&$('cname').focus(),300)}
  else if(c.id==='word'){showV();show('p-word')}
  else if(c.id==='pray'){show('p-pray');setTimeout(()=>!isTouch&&$('ptext').focus(),300)}
  else if(c.id==='bell'){bellSwing=1;bellSound();sendEvent({type:'bell'});toast('종소리가 예배당에 퍼집니다',2400)}
  else if(c.id==='altar'){player.rotation.y=Math.PI;toast('“수고하고 무거운 짐 진 자들아<br>다 내게로 오라”<br><small style="font-size:12px;opacity:.7">마태복음 11:28</small>',5000)}
  else if(c.id==='pew'){const w=c.pew;const x=Math.max(w.x0+.4,Math.min(w.x1-.4,player.position.x));sitting={x,z:w.z};player.position.set(x,0,w.z);player.rotation.y=Math.PI;show('p-sit')}
}
$('act').onclick=doAct;

/* ---------- 함께 있기 (실시간) ---------- */
const TOPIC='yebaedang/v1/main';
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const myId=Math.random().toString(36).slice(2,10);
let client=null,online=false,myName='순례자',myAvatar=0;
const peers=new Map();
const EMO=['🙏','👋','🕊️'];
function setNet(text,on){$('onlineText').textContent=text;$('online').classList.toggle('on',!!on)}
function updateCount(){if(online)setNet(peers.size?`지금 ${peers.size+1}명이 함께 있어요`:'지금은 혼자 머물고 있어요',true)}
function connect(bi){
  if(!window.mqtt){setNet('혼자 머무는 중 (연결 불가)');return}
  if(bi>=BROKERS.length*2){setNet('혼자 머무는 중 (연결 불가)');return}
  setNet('연결 중…');let ok=false;
  try{client=mqtt.connect(BROKERS[bi%BROKERS.length],{clientId:'ybd_'+myId+'_'+bi,clean:true,keepalive:30,reconnectPeriod:5000,connectTimeout:8000,
    will:{topic:TOPIC+'/bye',payload:myId,qos:0,retain:false}})}catch(e){connect(bi+1);return}
  client.on('connect',()=>{ok=true;online=true;connectedAt=performance.now();client.subscribe([TOPIC+'/s',TOPIC+'/e',TOPIC+'/bye']);lastSent=0;sendState(true);sendEvent({type:'hi'});updateCount()});
  client.on('close',()=>{if(online){online=false;setNet('다시 연결 중…')}});
  client.on('message',(topic,buf)=>{const str=buf.toString();
    if(topic.endsWith('/bye')){removePeer(str.slice(0,16));return}
    if(str.length>400)return;let m;try{m=JSON.parse(str)}catch(e){return}
    if(!m||typeof m.id!=='string'||m.id===myId||m.id.length>16)return;
    if(topic.endsWith('/s'))onState(m);else if(topic.endsWith('/e'))onEvent(m)});
  setTimeout(()=>{if(!ok){try{client.end(true)}catch(e){}connect(bi+1)}},10000);
}
function pub(sub,obj){if(online&&client)try{client.publish(TOPIC+sub,JSON.stringify(obj))}catch(e){}}
let lastSent=0,lastX=0,lastZ=0,lastR=0,lastS=false;
function sendState(force){const p=player.position,now=performance.now(),s=!!sitting;
  const changed=Math.abs(p.x-lastX)>.03||Math.abs(p.z-lastZ)>.03||Math.abs(player.rotation.y-lastR)>.05||s!==lastS;
  if(!force&&!(changed&&now-lastSent>110)&&now-lastSent<2500)return;
  lastSent=now;lastX=p.x;lastZ=p.z;lastR=player.rotation.y;lastS=s;
  pub('/s',{id:myId,n:myName,a:myAvatar,x:+p.x.toFixed(2),z:+p.z.toFixed(2),r:+player.rotation.y.toFixed(2),s:s?1:0})}
function sendEvent(e){e.id=myId;pub('/e',e)}
function netTick(){if(!frozen)sendState(false);
  const now=performance.now();for(const [id,pe] of peers)if(now-pe.seen>9000)removePeer(id)}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let connectedAt=0;
const num=(v,lo,hi,d)=>typeof v==='number'&&isFinite(v)?Math.max(lo,Math.min(hi,v)):d;
function onState(m){let pe=peers.get(m.id);const now=performance.now();
  const a=num(m.a,0,2,0)|0,n=String(m.n||'순례자').slice(0,10);
  if(!pe){if(peers.size>=40)return;pe={c:makeChar(a),a,n,label:labelSprite(n),tx:0,tz:0,tr:0,s:0,seen:now,lastEv:0,bub:null};
    pe.label.scale.set(1.3,.36,1);pe.label.material.depthTest=true;peers.set(m.id,pe);
    pe.c.g.position.set(num(m.x,-W,W,0),0,num(m.z,ZF,ZB,12));updateCount();
    if(!frozen&&now-connectedAt>4000)toast(`${esc(n)}님이 들어오셨어요`,2200);sendState(true)}
  if(pe.n!==n){pe.n=n;scene.remove(pe.label);pe.label=labelSprite(n);pe.label.scale.set(1.3,.36,1);pe.label.material.depthTest=true}
  if(pe.a!==a){pe.a=a;setLook(pe.c,a)}
  pe.tx=num(m.x,-W,W,0);pe.tz=num(m.z,ZF,ZB,0);pe.tr=num(m.r,-10,10,0);pe.s=m.s?1:0;pe.seen=now}
function removePeer(id){const pe=peers.get(id);if(!pe)return;scene.remove(pe.c.g,pe.c.shadow,pe.label);if(pe.bub)scene.remove(pe.bub.s);peers.delete(id);updateCount()}
function onEvent(m){const pe=peers.get(m.id),now=performance.now();
  if(m.type==='hi'){sendState(true);return}
  if(!pe||now-pe.lastEv<800)return;pe.lastEv=now;
  if(m.type==='candle'){candles.push({n:'',d:new Date().toDateString(),o:1});placeCandle(candles.length-1,true);bellSound(true);toast(`${esc(pe.n)}님이 촛불을 밝혔어요`,2400)}
  else if(m.type==='bell'){bellSwing=1;bellSound()}
  else if(m.type==='pray'){const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    g.position.set(PR.x,1.4,PR.z);g.scale.set(.8,.8,1);scene.add(g);const s=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,opacity:0}));s.visible=false;scene.add(s);risers.push({s,g,t:0})}
  else if(m.type==='emote'){showBubble(pe,EMO[num(m.e,0,2,0)|0])}}
// 이모티콘 말풍선
const emoTex={};
function emoSprite(e){if(!emoTex[e])emoTex[e]=canvasTex(128,128,g=>{g.fillStyle='rgba(236,230,216,.95)';g.beginPath();g.arc(64,58,50,0,7);g.fill();
  g.beginPath();g.moveTo(52,100);g.lineTo(64,124);g.lineTo(76,100);g.fill();g.font='56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,64,62)});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emoTex[e],transparent:true,depthTest:false}));s.scale.set(.6,.6,1);s.renderOrder=11;scene.add(s);return s}
function showBubble(holder,e){if(holder.bub)scene.remove(holder.bub.s);holder.bub={s:emoSprite(e),t:0}}
const meHolder={bub:null};let lastEmote=0;
function emote(i){const now=performance.now();if(frozen||now-lastEmote<1200)return;lastEmote=now;showBubble(meHolder,EMO[i]);sendEvent({type:'emote',e:i})}
document.querySelectorAll('#emotes .ibtn').forEach(b=>b.onclick=()=>emote(+b.dataset.e));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const i=['Digit1','Digit2','Digit3'].indexOf(e.code);if(i>=0)emote(i)});
function tickBubble(h,x,y,z,dt){if(!h.bub)return;h.bub.t+=dt;const b=h.bub;b.s.position.set(x,y+Math.min(.3,b.t*.6),z);
  b.s.material.opacity=b.t<2.2?1:Math.max(0,1-(b.t-2.2)/.6);if(b.t>2.8){scene.remove(b.s);h.bub=null}}
function updatePeers(dt,t){const k=1-Math.exp(-dt*10);
  for(const pe of peers.values()){const g=pe.c.g;const ox=g.position.x,oz=g.position.z;
    g.position.x+=(pe.tx-ox)*k;g.position.z+=(pe.tz-oz)*k;
    const sp=Math.hypot(g.position.x-ox,g.position.z-oz)/Math.max(dt,1e-3);const mv=sp>.4&&!pe.s;if(mv)pe.c.walkT+=dt*7;
    let d=pe.tr-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*k;
    poseChar(pe.c,mv,pe.s,dt,t);
    pe.label.position.set(g.position.x,g.position.y+2.05,g.position.z);
    tickBubble(pe,g.position.x,g.position.y+2.5,g.position.z,dt)}
  tickBubble(meHolder,player.position.x,player.position.y+2.2,player.position.z,dt)}
addEventListener('pagehide',()=>{if(online)try{client.publish(TOPIC+'/bye',myId);client.end(true)}catch(e){}});

/* ---------- 루프 ---------- */
let camDist=6.2;const camPos=new THREE.Vector3(0,4,18),look=new THREE.Vector3();
const clock=new THREE.Clock();
function collide(p,r){for(const c of colliders){const cx=Math.max(c.x0,Math.min(c.x1,p.x)),cz=Math.max(c.z0,Math.min(c.z1,p.z));
  const dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);if(d<r){if(d<1e-4){p.z=c.z1+r}else{p.x=cx+dx/d*r;p.z=cz+dz/d*r}}}
  p.x=Math.max(-W+.85,Math.min(W-.85,p.x));p.z=Math.max(ZF+.6,Math.min(ZB-.5,p.z))}
const areaName=z=>z<PLAT?'제단':z>9.5?'입구':'본당';
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // 이동
  let mx=0,mz=0;
  if(!frozen&&!sitting&&!openPanel){
    if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
    mx+=joy.x;mz+=joy.y;
  }
  const mag=Math.min(1,Math.hypot(mx,mz));let moving=mag>.08;
  if(moving){const sp=(keys.ShiftLeft||keys.ShiftRight?1.4:3.2)/Math.max(1,Math.hypot(mx,mz));const cy=Math.cos(yaw),sy=Math.sin(yaw);
    const dx=(mx*cy+mz*sy)*sp*dt,dz=(-mx*sy+mz*cy)*sp*dt;player.position.x+=dx;player.position.z+=dz;collide(player.position,.38);
    const target=Math.atan2(dx,dz);let d=target-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*10);
    }
  if(moving)me.walkT+=dt*7;
  poseChar(me,moving,!!sitting,dt,t);const z=player.position.z;
  updatePeers(dt,t);netTick(moving);
  // 상호작용 탐색
  current=null;
  if(!frozen&&!sitting){let best=1e9;for(const s of spots){const d=Math.hypot(player.position.x-s.x,player.position.z-s.z);if(d<s.r&&d<best){best=d;current=s}}
    if(!current){const w=nearestPew();if(w)current={id:'pew',name:'앉아서 머물기',pew:w}}}
  spots.forEach(s=>{const d=Math.hypot(player.position.x-s.x,player.position.z-s.z);s.label.material.opacity=Math.max(0,Math.min(1,(9-d)/4))*(frozen?0:1);s.label.position.y=s.ly+Math.sin(t*1.5+s.x)*.06});
  const act=$('act');
  if(current&&!openPanel){$('actText').textContent=current.name;act.classList.add('show')}else act.classList.remove('show');
  $('where').textContent=sitting?'장의자':current&&current.where?current.where:areaName(z);
  // 촛불 흔들림
  for(const f of flames){const u=f.userData;if(u.grow!==undefined){u.grow=Math.min(1,u.grow+dt*1.5);if(u.grow>=1)delete u.grow}
    const g=u.grow??1,k=1+Math.sin(t*9+u.ph)*.08+Math.sin(t*23+u.ph)*.05;f.scale.set(.22*u.s*g*(2-k),.36*u.s*g*k,1)}
  standLight.intensity+=((candleMeshes.length?.4+candleMeshes.length*.12:0)*(1+Math.sin(t*7)*.06)-standLight.intensity)*.1;
  crossGlow.material.opacity=.3+Math.sin(t*.7)*.06;
  // 종
  if(bellSwing>0){bellSwing=Math.max(0,bellSwing-dt*.35);bellPivot.rotation.x=Math.sin(t*6)*.5*bellSwing}
  // 기도 상승
  for(let i=risers.length-1;i>=0;i--){const r=risers[i];r.t+=dt;const y=1.4+r.t*1.1;r.s.position.y=y+.4;r.g.position.y=y;r.s.position.x=r.g.position.x=PR.x+Math.sin(r.t*1.4)*.25;
    const o=r.t<.6?r.t/.6:Math.max(0,1-(r.t-3)/2.5);r.s.material.opacity=o;r.g.material.opacity=o;
    if(r.t>5.5){scene.remove(r.s,r.g);risers.splice(i,1)}}
  // 먼지
  const pa=dustGeo.attributes.position.array;for(let i=0;i<dustN;i++){pa[i*3+1]+=dt*.05;pa[i*3]+=Math.sin(t*.3+i)*dt*.02;if(pa[i*3+1]>7)pa[i*3+1]=0}dustGeo.attributes.position.needsUpdate=true;
  // 카메라
  const pp=player.position;const d=sitting?4.2:camDist;
  const want=new THREE.Vector3(pp.x+Math.sin(yaw)*Math.cos(pitch)*d,pp.y+1.2+Math.sin(pitch)*d,pp.z+Math.cos(yaw)*Math.cos(pitch)*d);
  want.x=Math.max(-W+.4,Math.min(W-.4,want.x));want.y=Math.min(8.5,want.y);
  if(frozen){want.set(Math.sin(t*.1)*6,5.5,6+Math.cos(t*.1)*3);look.lerp(new THREE.Vector3(0,2.5,-12),.05)}
  else look.lerp(new THREE.Vector3(pp.x,pp.y+1.2,pp.z),.15);
  camPos.lerp(want,frozen?.02:.12);camera.position.copy(camPos);camera.lookAt(look);
  renderer.render(scene,camera);requestAnimationFrame(loop)}
setAvatar(0);loop();
</script>
